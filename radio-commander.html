<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Commander</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root{
    --bg-top:#eef1f5;
    --bg-bottom:#dde2e9;
    --card-bg: rgba(255,255,255,0.78);
    --card-border: rgba(255,255,255,0.9);
    --text-primary:#1c1c1e;
    --text-secondary:#6e6e73;
    --accent:#c0392b;
    --accent-soft: rgba(192,57,43,0.12);
    --shadow: 0 16px 40px rgba(30,30,40,0.12), 0 2px 8px rgba(30,30,40,0.05);
    --radius-card: 22px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: radial-gradient(circle at 25% 15%, var(--bg-top), var(--bg-bottom) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-primary);
  }

  .stage{
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 140px;
  }

  .page-header{
    margin-bottom: 28px;
  }

  .page-title{
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }

  .page-sub{
    font-size: 14px;
    color: var(--text-secondary);
    margin: 0;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  @media (max-width: 560px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }

  .station-card{
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    padding: 14px 12px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    position:relative;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-user-select:none;
    user-select:none;
  }

  .station-card:active{
    transform: scale(0.96);
  }

  .station-card.playing{
    box-shadow: 0 16px 40px rgba(192,57,43,0.22), 0 2px 8px rgba(30,30,40,0.06);
  }

  .logo-box{
    width:100%;
    aspect-ratio: 1 / 1;
    background:#ffffff;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.10), inset 0 0 0 1px rgba(0,0,0,0.04);
    overflow:hidden;
    position:relative;
    margin-bottom:10px;
  }

  .logo-box img{
    width:78%;
    height:78%;
    object-fit:contain;
    display:block;
  }

  .play-overlay{
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.0);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .station-card:hover .play-overlay{
    opacity:1;
    background: rgba(20,20,22,0.32);
  }

  .station-card.playing .play-overlay{
    opacity:1;
    background: rgba(20,20,22,0.28);
  }

  .play-overlay svg{
    width:30px;
    height:30px;
    fill:#fff;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }

  .icon-pause-overlay{ display:none; }
  .station-card.playing .icon-play-overlay{ display:none; }
  .station-card.playing .icon-pause-overlay{ display:block; }

  .buffering-ring{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
  }

  .station-card.loading .buffering-ring{ display:flex; }
  .station-card.loading .play-overlay{ opacity:1; background: rgba(20,20,22,0.32); }
  .station-card.loading .play-overlay svg{ display:none; }

  .spinner{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.35);
    border-top-color:#fff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .station-name{
    font-size:13px;
    font-weight:600;
    text-align:center;
    line-height:1.25;
    max-width:100%;
  }

  .live-badge{
    position:absolute;
    top:8px;
    left:8px;
    display:flex;
    align-items:center;
    gap:4px;
    background: rgba(20,20,22,0.55);
    backdrop-filter: blur(6px);
    padding:3px 7px 3px 6px;
    border-radius:20px;
    opacity:0;
    transition: opacity 0.15s ease;
  }

  .station-card.playing .live-badge{ opacity:1; }

  .live-dot-small{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ff4d3d;
    box-shadow: 0 0 0 0 rgba(255,77,61,0.5);
    animation: pulse-small 2.2s infinite;
  }

  @keyframes pulse-small{
    0%{ box-shadow: 0 0 0 0 rgba(255,77,61,0.5); }
    70%{ box-shadow: 0 0 0 5px rgba(255,77,61,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,77,61,0); }
  }

  .live-badge span{
    font-size:9px;
    font-weight:700;
    letter-spacing:0.02em;
    color:#fff;
  }

  .now-playing{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    justify-content:center;
    padding: 0 16px 20px;
    transform: translateY(140%);
    transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
    pointer-events:none;
  }

  .now-playing.visible{
    transform: translateY(0);
    pointer-events:auto;
  }

  .np-card{
    width:100%;
    max-width: 480px;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(30,30,40,0.18), 0 2px 8px rgba(30,30,40,0.08);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    padding: 12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }

  .np-logo{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    flex-shrink:0;
    overflow:hidden;
  }

  .np-logo img{
    width:75%;
    height:75%;
    object-fit:contain;
  }

  .np-info{
    flex:1;
    min-width:0;
  }

  .np-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .np-status{
    font-size:11px;
    color: var(--text-secondary);
  }

  .np-play-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background: linear-gradient(180deg, #2a2a2c, #131314);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  .np-play-btn svg{ width:16px; height:16px; fill:#fff; }
  .np-play-btn .np-icon-pause{ display:none; }
  .np-play-btn.is-playing .np-icon-play{ display:none; }
  .np-play-btn.is-playing .np-icon-pause{ display:block; }

  .np-mute-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background: var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  .np-mute-btn svg{ width:15px; height:15px; fill: var(--accent); }

  .np-volume{
    width:70px;
    flex-shrink:0;
  }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:5px;
    border-radius:3px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill,70%), rgba(0,0,0,0.08) var(--fill,70%), rgba(0,0,0,0.08) 100%);
    outline:none;
    cursor:pointer;
  }

  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(0,0,0,0.05);
    cursor:pointer;
  }

  input[type="range"]::-moz-range-thumb{
    width:15px;
    height:15px;
    border-radius:50%;
    background:#fff;
    border:none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(0,0,0,0.05);
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="page-header">
    <p class="page-title">Radio Commander</p>
    <p class="page-sub">Tocca una stazione per ascoltarla in diretta</p>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="now-playing" id="nowPlaying">
  <div class="np-card">
    <div class="np-logo" id="npLogoBox"><img id="npLogo" src="" alt=""></div>
    <div class="np-info">
      <div class="np-name" id="npName">—</div>
      <div class="np-status" id="npStatus">In pausa</div>
    </div>
    <button class="np-play-btn" id="npPlayBtn" aria-label="Play/Pausa">
      <svg class="np-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="np-icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="np-mute-btn" id="npMuteBtn" aria-label="Muto">
      <svg id="npVolIcon" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-.77-3.29-2-4.36v8.72c1.23-1.07 2-2.59 2-4.36z"/></svg>
    </button>
    <div class="np-volume">
      <input type="range" id="npVolumeSlider" min="0" max="100" value="70">
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
  const stations = [
    {
      id: "radioradicale",
      name: "Radio Radicale",
      logo: "https://www.radioradicale.it/sites/all/themes/radioradicale_2014/images/logo2015_152.png",
      url: "http://livemp3.radioradicale.it/live.mp3",
      type: "audio"
    },
    {
      id: "radio24",
      name: "Radio 24",
      logo: "https://it.wikipedia.org/wiki/Special:FilePath/Radio_24_-_Logo_2019.svg",
      url: "https://ilsole24ore-radio.akamaized.net/hls/live/2035301/radio24/playlist.m3u8",
      type: "hls"
    },
    {
      id: "rairadio1",
      name: "Rai Radio 1",
      logo: "https://commons.wikimedia.org/wiki/Special:FilePath/Rai_Radio_1_-_Logo_2017.svg",
      url: "https://icestreaming.rai.it/1.mp3",
      type: "audio"
    },
    {
      id: "rairadio2",
      name: "Rai Radio 2",
      logo: "https://commons.wikimedia.org/wiki/Special:FilePath/Rai_Radio_2_-_Logo_2017.svg",
      url: "https://icestreaming.rai.it/2.mp3",
      type: "audio"
    },
    {
      id: "rairadio3",
      name: "Rai Radio 3",
      logo: "https://commons.wikimedia.org/wiki/Special:FilePath/Rai_Radio_3_-_Logo_2017.svg",
      url: "https://icestreaming.rai.it/3.mp3",
      type: "audio"
    },
    {
      id: "bbcnews",
      name: "BBC News",
      logo: "https://commons.wikimedia.org/wiki/Special:FilePath/BBC_News_2022.svg",
      url: "https://stream.live.vc.bbcmedia.co.uk/bbc_world_service",
      type: "audio"
    }
  ];

  const grid = document.getElementById('grid');
  const audio = document.getElementById('audio');
  const nowPlaying = document.getElementById('nowPlaying');
  const npLogo = document.getElementById('npLogo');
  const npName = document.getElementById('npName');
  const npStatus = document.getElementById('npStatus');
  const npPlayBtn = document.getElementById('npPlayBtn');
  const npMuteBtn = document.getElementById('npMuteBtn');
  const npVolIcon = document.getElementById('npVolIcon');
  const npVolumeSlider = document.getElementById('npVolumeSlider');

  const ICON_VOLUME = '<path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-.77-3.29-2-4.36v8.72c1.23-1.07 2-2.59 2-4.36z"/>';
  const ICON_MUTE = '<path d="M16.5 12c0-1.77-.77-3.29-2-4.36v2.73l1.88 1.88c.08-.4.12-.81.12-1.25zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.8L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

  let currentStation = null;
  let hls = null;
  let previousVolume = 0.7;
  audio.volume = 0.7;

  function buildCards(){
    stations.forEach(st => {
      const card = document.createElement('div');
      card.className = 'station-card';
      card.dataset.id = st.id;
      card.innerHTML = `
        <div class="logo-box">
          <img src="${st.logo}" alt="${st.name}" loading="lazy">
          <div class="live-badge"><span class="live-dot-small"></span><span>LIVE</span></div>
          <div class="play-overlay">
            <svg class="icon-play-overlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause-overlay" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </div>
          <div class="buffering-ring"><div class="spinner"></div></div>
        </div>
        <div class="station-name">${st.name}</div>
      `;
      card.addEventListener('click', () => toggleStation(st));
      grid.appendChild(card);
    });
  }

  function cardEl(id){
    return grid.querySelector(`.station-card[data-id="${id}"]`);
  }

  function clearCardStates(){
    grid.querySelectorAll('.station-card').forEach(c => {
      c.classList.remove('playing', 'loading');
    });
  }

  function destroyHls(){
    if (hls){
      hls.destroy();
      hls = null;
    }
  }

  function toggleStation(st){
    if (currentStation && currentStation.id === st.id){
      if (audio.paused){
        playCurrent();
      } else {
        audio.pause();
      }
      return;
    }
    loadStation(st);
  }

  function loadStation(st){
    destroyHls();
    currentStation = st;
    clearCardStates();
    const card = cardEl(st.id);
    card.classList.add('loading');

    npLogo.src = st.logo;
    npName.textContent = st.name;
    npStatus.textContent = 'Connessione…';
    nowPlaying.classList.add('visible');

    if (st.type === 'hls' && window.Hls && Hls.isSupported()){
      hls = new Hls();
      hls.loadSource(st.url);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        audio.play().catch(()=>{});
      });
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal){
          onError();
        }
      });
    } else if (st.type === 'hls' && audio.canPlayType('application/vnd.apple.mpegurl')){
      audio.src = st.url;
      audio.play().catch(onError);
    } else {
      audio.src = st.url;
      audio.play().catch(onError);
    }
  }

  function playCurrent(){
    if (!currentStation) return;
    const card = cardEl(currentStation.id);
    card.classList.add('loading');
    audio.play().catch(onError);
  }

  function onError(){
    if (!currentStation) return;
    clearCardStates();
    npStatus.textContent = 'Stream non disponibile';
    npPlayBtn.classList.remove('is-playing');
  }

  audio.addEventListener('waiting', () => {
    if (!currentStation) return;
    cardEl(currentStation.id).classList.add('loading');
    npStatus.textContent = 'Connessione…';
  });

  audio.addEventListener('playing', () => {
    if (!currentStation) return;
    clearCardStates();
    cardEl(currentStation.id).classList.add('playing');
    npStatus.textContent = 'In diretta';
    npPlayBtn.classList.add('is-playing');
  });

  audio.addEventListener('pause', () => {
    if (!currentStation) return;
    const card = cardEl(currentStation.id);
    card.classList.remove('playing', 'loading');
    npStatus.textContent = 'In pausa';
    npPlayBtn.classList.remove('is-playing');
  });

  audio.addEventListener('error', onError);

  npPlayBtn.addEventListener('click', () => {
    if (!currentStation) return;
    if (audio.paused){
      playCurrent();
    } else {
      audio.pause();
    }
  });

  function updateVolumeUI(vol, muted){
    const pct = muted ? 0 : Math.round(vol * 100);
    npVolumeSlider.value = pct;
    npVolumeSlider.style.setProperty('--fill', pct + '%');
    npVolIcon.innerHTML = (muted || vol === 0) ? ICON_MUTE : ICON_VOLUME;
  }

  npVolumeSlider.addEventListener('input', (e) => {
    const val = Number(e.target.value) / 100;
    audio.muted = false;
    audio.volume = val;
    previousVolume = val > 0 ? val : previousVolume;
    updateVolumeUI(val, false);
  });

  npMuteBtn.addEventListener('click', () => {
    audio.muted = !audio.muted;
    updateVolumeUI(audio.muted ? 0 : (audio.volume || previousVolume), audio.muted);
  });

  buildCards();
  updateVolumeUI(audio.volume, audio.muted);
</script>

</body>
</html>
